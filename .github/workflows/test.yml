name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-runner:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - test-oci

    steps:
      # 1. Download the latest code from GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Verify the self-hosted runner
      - name: Test runner
        run: |
          echo "GitHub Actions is working"
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          echo "Operating System:"
          uname -a

      # 3. Verify Docker
      - name: Test Docker
        run: |
          echo "Docker version:"
          docker --version

          echo "Docker status:"
          docker ps

      # 4. Build Backend Docker image
      - name: Build Backend Docker image
        run: |
          echo "Building backend image..."
          docker build \
            -t zfs-backend:test \
            "./Update-code 01-12-2025/backend"

      # 5. Build Frontend Docker image
      - name: Build Frontend Docker image
        run: |
          echo "Building frontend image..."
          docker build \
            -t zfs-frontend:test \
            "./Update-code 01-12-2025/frontend"

      # 6. Verify that both images were created
      - name: Verify Docker images
        run: |
          echo "Available Docker images:"
          docker images
