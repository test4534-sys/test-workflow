name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - test-oci

    steps:
      # 1. Download latest source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Verify runner and Docker
      - name: Verify environment
        run: |
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          docker --version

      # 3. Build Backend Docker image
      - name: Build Backend image
        run: |
          docker build \
            -t zfs-backend:test \
            "./Update-code 01-12-2025/backend"

      # 4. Build Frontend Docker image
      - name: Build Frontend image
        run: |
          docker build \
            -t zfs-frontend:test \
            "./Update-code 01-12-2025/frontend"

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      # 6. Tag Backend image for Docker Hub
      - name: Tag Backend image
        run: |
          docker tag zfs-backend:test \
            ${{ secrets.DOCKERHUB_USERNAME }}/zfs-backend:latest

      # 7. Push Backend image to Docker Hub
      - name: Push Backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/zfs-backend:latest

      # 8. Tag Frontend image for Docker Hub
      - name: Tag Frontend image
        run: |
          docker tag zfs-frontend:test \
            ${{ secrets.DOCKERHUB_USERNAME }}/zfs-frontend:latest

      # 9. Push Frontend image to Docker Hub
      - name: Push Frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/zfs-frontend:latest

      # 10. Deploy Backend
      - name: Deploy Backend
        run: |
          docker rm -f zfs-backend || true

          docker run -d \
            --name zfs-backend \
            --restart unless-stopped \
            -p 2435:2435 \
            zfs-backend:test

      # 11. Deploy Frontend
      - name: Deploy Frontend
        run: |
          docker rm -f zfs-frontend || true

          docker run -d \
            --name zfs-frontend \
            --restart unless-stopped \
            -p 8080:80 \
            zfs-frontend:test

      # 12. Verify deployment
      - name: Verify deployment
        run: |
          sleep 5

          echo "Running containers:"
          docker ps

          echo "Testing Backend:"
          curl --fail http://localhost:2435

          echo "Testing Frontend:"
          curl --fail http://localhost:8080
