name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - test-oci

    steps:
      # Download latest code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Check runner and Docker
      - name: Verify environment
        run: |
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          docker --version

      # Build Backend
      - name: Build Backend image
        run: |
          docker build \
            -t zfs-backend:test \
            "./Update-code 01-12-2025/backend"

      # Build Frontend
      - name: Build Frontend image
        run: |
          docker build \
            -t zfs-frontend:test \
            "./Update-code 01-12-2025/frontend"

      # Deploy Backend
      - name: Deploy Backend
        run: |
          docker run -d \
            --name zfs-backend \
            --restart unless-stopped \
            -p 2435:2435 \
            zfs-backend:test

      # Deploy Frontend
      - name: Deploy Frontend
        run: |
          docker run -d \
            --name zfs-frontend \
            --restart unless-stopped \
            -p 8080:80 \
            zfs-frontend:test

      # Verify deployment
      - name: Verify deployment
        run: |
          sleep 5

          echo "Running containers:"
          docker ps

          echo "Testing Backend:"
          curl --fail http://localhost:2435

          echo "Testing Frontend:"
          curl --fail http://localhost:8080
